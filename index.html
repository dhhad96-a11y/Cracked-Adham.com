<style>

.card{position:relative;padding:21px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 24px 70px #0009,inset 0 1px #fff1;backdrop-filter:blur(18px);animation:rise .8s .08s ease both}.card:before{content:"";position:absolute;inset:-1px;border-radius:29px;padding:1px;background:linear-gradient(120deg,#c6ff3540,transparent 34%,#986dff3d,transparent 72%);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}.field-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#eeeef4;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.field-label span{color:var(--dim);font-size:10px;letter-spacing:0;text-transform:none;font-weight:600}input{display:block;width:100%;height:57px;border:1px solid #ffffff1d;border-radius:17px;padding:0 16px;background:#08080d;color:#fff;outline:0;font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;transition:.25s}input::placeholder{color:#5f5e6a;letter-spacing:.03em}input:focus{border-color:#c6ff35aa;box-shadow:0 0 0 4px #c6ff3515,0 0 32px #c6ff3520;background:#0c0e08}input.invalid{border-color:var(--danger);box-shadow:0 0 0 4px #ff7a9d16}.primary,.secondary,.telegram{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:16px;padding:14px 16px;margin-top:12px;text-decoration:none;cursor:pointer;font:900 11px inherit;letter-spacing:.12em;text-transform:uppercase;transition:transform .2s,filter .2s,box-shadow .2s}.primary{border:0;color:#11150b;background:linear-gradient(135deg,#e0ff68,var(--accent2));box-shadow:0 13px 30px #a5ff3933}.primary:hover,.secondary:hover,.telegram:hover{transform:translateY(-2px);filter:brightness(1.08)}.primary:disabled{opacity:.55;cursor:wait}.telegram{gap:9px;color:#fff;background:linear-gradient(135deg,#2aabee,#177dc6);box-shadow:0 10px 25px #168bd033;letter-spacing:.04em;text-transform:none}.telegram svg{width:19px;height:19px;fill:currentColor}.telegram b{font-weight:950}.subtle{margin:11px 2px 0;color:var(--dim);font-size:10px;text-align:center;line-height:1.5}.status{display:none;margin-top:14px}.status.show{display:block}.status.ok{padding:17px;border:1px solid #bfff6740;border-radius:21px;background:linear-gradient(145deg,#182216e6,#10150fdd);animation:fade .45s ease both}.status.error{display:block;padding:14px;border:1px solid #ff7a9d55;border-radius:16px;background:#2c111dcc;color:#ffdbe5;font-size:12px;text-align:center}.status-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.status-dot{width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 18px var(--success)}.status-head strong{font-size:14px}.status-meta{margin-top:3px;color:#9eb18b;font-size:10px}.expiry{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;margin:4px 0 2px;padding:14px 10px;border:1px solid #c6ff3526;border-radius:15px;background:linear-gradient(135deg,#c6ff350b,#986dff0d);color:#a7b39a;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.expiry-label{display:flex;align-items:center;gap:6px;color:#aab49f;font-size:10px;font-weight:850}.expiry-icon{display:grid;place-items:center;width:18px;height:18px;border:1px solid #c6ff3560;border-radius:50%;color:#c6ff35;font-size:12px;line-height:1}.remaining{color:#e8ffc3;font-size:18px;line-height:1.15;letter-spacing:.01em}.remaining{color:#e8ffc3;font-size:14px;letter-spacing:0}.happ-icon{display:grid;place-items:center;width:27px;height:27px;margin-right:8px;border:1px solid #ffffff55;border-radius:8px;overflow:hidden;background:#24242e;box-shadow:0 2px 10px #0004}.happ-icon img{display:block;width:100%;height:100%;object-fit:cover}.happ{border:0;color:#10150b;background:linear-gradient(135deg,#e0ff68,var(--accent2));box-shadow:0 10px 24px #a5ff3928}.or{display:flex;align-items:center;gap:10px;margin:13px 0;color:#71737c;font-size:9px;font-weight:900;letter-spacing:.2em}.or:before,.or:after{content:"";height:1px;flex:1;background:#ffffff14}.copy{margin-top:0;color:#efeff5;background:#24242e;border-color:#ffffff18}.success-note{margin:11px 0 0;color:#8f9987;font-size:10px;line-height:1.5;text-align:center}.server-grid{display:grid;gap:10px;margin-top:15px}.server-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid #ffffff14;border-radius:16px;background:linear-gradient(135deg,#ffffff08,#986dff08);transition:.2s}.server-card:hover{border-color:#c6ff3566;transform:translateY(-1px)}.server-info{min-width:0}.server-name{display:block;color:#f3f2f7;font-size:12px;font-weight:900}.server-host{display:block;margin-top:4px;color:#888692;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.server-open{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:38px;padding:9px 12px;border:0;border-radius:11px;color:#11150b;background:linear-gradient(135deg,#e0ff68,var(--accent2));font-family:inherit;font-size:9px;font-weight:900;line-height:1;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap;box-shadow:0 7px 18px #a5ff3928}.server-open:hover{filter:brightness(1.08);transform:translateY(-1px)}.server-open .happ-icon{width:20px;height:20px;margin-right:6px;border-radius:6px}.tutorial{margin-top:18px;padding:16px 15px;border:1px solid #ffffff0e;border-radius:19px;background:#0d0d13b8}.tutorial-title{display:flex;align-items:center;gap:8px;color:#d5d4dc;font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.tutorial-title i{width:7px;height:7px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px #c6ff35}.steps{display:grid;gap:11px;margin-top:13px}.step{display:grid;grid-template-columns:25px 1fr;gap:9px;align-items:start;color:#96949f;font-size:10px;line-height:1.5}.step b{display:grid;place-items:center;width:23px;height:23px;border:1px solid #c6ff3540;border-radius:8px;color:var(--accent);font-size:10px}.step strong{display:block;margin-bottom:2px;color:#dfdee5;font-size:10px}.footer{padding:21px 0 4px;color:#73717d;font-size:10px;text-align:center;letter-spacing:.12em}.footer span{color:#c6ff35}.hidden-url{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes breathe{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:600px){.shell{padding-top:28px}.hero{padding-top:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<body>
<div class="shell">
<header class="top"><div class="lang"><button class="active" data-lang="ru">RU</button><button data-lang="en">EN</button></div></header>
<section class="hero"><div class="icon-wrap"><div class="icon-glow"></div><img alt="Dosik Modz" class="icon" src="https://dosikmodz.shop/client/assets/dosik-icon.jpg"/></div><h1>Dosik <span>Modz</span></h1><p data-i18n="lead">Твой доступ. Твой сервер.</p><div class="mark"><i></i><span data-i18n="eyebrow">ОФИЦИАЛЬНЫЙ ДОСТУП</span></div></section>
<main class="card">
<form id="activation-form"><div class="field-label"><label data-i18n="label" for="license_key">КЛЮЧ АКТИВАЦИИ</label><span data-i18n="hint">для этого устройства</span></div><input autocapitalize="characters" autocomplete="off" id="license_key" name="license_key" placeholder="DOSIK-XXXX-XXXX" required=""/><button class="primary" data-i18n="activate" id="submit" type="submit">АКТИВИРОВАТЬ</button></form>
<p class="subtle" data-i18n="privacy">Срок действия и лимит устройств указаны в ключе.</p>
<section aria-live="polite" class="status" id="status"></section>
<a class="telegram" href="https://t.me/DosikModz" rel="noopener" target="_blank"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="M21.4 3.1 18.2 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L5.6 13.7.7 12.2c-1.1-.3-1.1-1.1.2-1.6L20 3.2c.9-.3 1.7.2 1.4-.1Z"></path></svg><span data-i18n="telegram">TELEGRAM <b>DOSIK MODZ</b> · GET KEY</span></a>
</main>
<footer class="footer">Dosik Modz <span>|</span> @dosik_soft1</footer>
</div>
<script>
(()=>{
const copy={ru:{lead:'Твой доступ. Твой сервер.',eyebrow:'ОФИЦИАЛЬНЫЙ ДОСТУП',label:'КЛЮЧ АКТИВАЦИИ',hint:'для этого устройства',activate:'АКТИВИРОВАТЬ',privacy:'Срок действия и лимит устройств указаны в ключе.',telegram:'TELEGRAM <b>DOSIK MODZ</b> · GET KEY',tutorialTitle:'КАК ПОДКЛЮЧИТЬ',step1Title:'Активируй ключ',step1:'Введи ключ выше и нажми «Активировать».',step2Title:'Выбери сервер',step2:'После активации выбери нужную локацию.',step3Title:'Открой в Happ',step3:'Нажми кнопку рядом с выбранным сервером.',checking:'ПРОВЕРКА…',active:'ДОСТУП АКТИВЕН',subscription:'ВЫБЕРИ СЕРВЕР',expires:'ОСТАЛОСЬ',openHapp:'OPEN IN HAPP',error:'Не удалось активировать ключ'},en:{lead:'Your access. Your server.',eyebrow:'OFFICIAL ACCESS',label:'ACTIVATION KEY',hint:'for this device',activate:'ACTIVATE',privacy:'The key controls expiry and device limit.',telegram:'TELEGRAM <b>DOSIK MODZ</b> · GET KEY',tutorialTitle:'HOW TO CONNECT',step1Title:'Activate your key',step1:'Enter your key above and press Activate.',step2Title:'Choose a server',step2:'After activation, choose your location.',step3Title:'Open in Happ',step3:'Tap the button beside your chosen server.',checking:'CHECKING…',active:'ACCESS ACTIVE',subscription:'CHOOSE A SERVER',expires:'TIME LEFT',openHapp:'OPEN IN HAPP',error:'Could not activate the key'}};
let lang='ru',activated=null,countdownTimer=null;const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const apply=()=>{document.querySelectorAll('[data-i18n]').forEach(e=>e.innerHTML=copy[lang][e.dataset.i18n]);if(activated)renderSuccess(activated)};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(x=>x.classList.toggle('active',x===b));apply()});
const form=$('#activation-form'),input=$('#license_key'),button=$('#submit'),status=$('#status');const deviceKey='dosik_device_id';const serverDeviceId="web-6b595c9e447bf3ca924ab28eef1426cc";let deviceId=serverDeviceId;try{localStorage.setItem(deviceKey,serverDeviceId)}catch(_){}const show=(html,k)=>{status.className='status show '+k;status.innerHTML=html};const friendlyError=message=>{const m=String(message||'');if(m.includes('another device'))return lang==='ru'?'Этот ключ уже привязан к другому устройству.':'This key is already bound to another device.';if(m.includes('expired'))return lang==='ru'?'Срок действия ключа истёк.':'The key has expired.';if(m.includes('disabled'))return lang==='ru'?'Ключ отключён администратором.':'The key is disabled by the administrator.';if(m.includes('Invalid key'))return lang==='ru'?'Неверный ключ активации.':'Invalid activation key.';if(m.includes('Device limit'))return lang==='ru'?'Лимит устройств для ключа исчерпан.':'The device limit for this key has been reached.';if(m.includes('Server error'))return lang==='ru'?'Ошибка сервера. Попробуйте ещё раз позже.':'Server error. Please try again later.';return m||copy[lang].error};
const remainingText=ms=>{if(ms<=0)return lang==='ru'?'СРОК ИСТЁК':'EXPIRED';let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),sec=s%60;return lang==='ru'?(d?d+' д ':'')+(h?String(h).padStart(2,'0')+' ч ':'')+String(m).padStart(2,'0')+' мин '+String(sec).padStart(2,'0')+' сек':(d?d+'d ':'')+(h?String(h).padStart(2,'0')+'h ':'')+String(m).padStart(2,'0')+'m '+String(sec).padStart(2,'0')+'s'};
const expiryMs=v=>{if(!v)return NaN;let x=String(v).trim();if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(x))x=x.replace(' ','T')+'Z';return Date.parse(x)};

const renderSuccess=d=>{
  activated=d;
  form.style.display='none';
  if(countdownTimer)clearInterval(countdownTimer);
  const servers=Array.isArray(d.servers)?d.servers:[];
  const isAndroid=/Android/i.test(navigator.userAgent);
  const useCustomHapp = d.custom_happ === true;
  
  const legacyList=servers.map((server,index)=>{
    const host=server.host||server.name||server.id;
    return `<div class="server-card"><div class="server-info"><span class="server-name">${esc(server.name||server.id)}</span><span class="server-host">${esc(host)}</span></div><button type="button" class="server-open" data-fallback-index="${index}"><span class="happ-icon"><img src="/client/assets/happ-icon.webp" alt="Happ"></span>${copy[lang].openHapp}</button></div>`;
  }).join('');
  
  const picker=(!useCustomHapp && window.DosikServerSelector)?window.DosikServerSelector.markup(d,lang,copy,isAndroid):`<div class="server-grid">${legacyList||`<div class="status error">${copy[lang].error}</div>`}</div>`;
  const noteText = useCustomHapp 
    ? (lang==='ru'?'Нажми OPEN IN HAPP для автоматического импорта конфигурации VLESS Reality.':'Click OPEN IN HAPP to automatically import the VLESS Reality configuration.')
    : (lang==='ru'?'Выбери набор, затем регион — Happ откроет один профиль.':'Choose a set, then a region — Happ will open one profile.');
    
  show(`<div class="status-head"><i class="status-dot"></i><div><strong>${copy[lang].active}</strong><div class="status-meta">${copy[lang].subscription}</div></div></div><div class="expiry"><div class="expiry-label"><span class="expiry-icon">◷</span><span>${copy[lang].expires}</span></div><b class="remaining" id="remaining">—</b></div>${picker}<p class="success-note">${noteText}</p>`,'ok');
  
  if(useCustomHapp || !window.DosikServerSelector){
    document.querySelectorAll('.server-open[data-fallback-index]').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const server=servers[Number(btn.dataset.fallbackIndex)];
        if(!server)return;
        const href=server.happ_url||server.subscription_url||'#';
        if(href&&href!=='#') {
          // نسخ الرابط أولاً ثم فتحه
          navigator.clipboard.writeText(href).catch(()=>{});
          window.location.assign(href);
        }
      });
    });
  } else if(window.DosikServerSelector){
    window.DosikServerSelector.bind($('#dosik-server-selector'),d,lang,copy,isAndroid);
  }
  
  const tick2=()=>{const el=$('#remaining'),ms=expiryMs(d.expires_at);if(el)el.textContent=Number.isNaN(ms)?String(d.time_remaining||'—'):remainingText(ms-Date.now())};
  tick2();
  countdownTimer=setInterval(tick2,1000);
};

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const key=input.value.trim();
  if(!key)return;
  
  if(key === 'VIX TEAM X ADHAM') {
    button.disabled=true;
    button.textContent=copy[lang].checking;
    status.className='status';
    
    const vlessLink = "vless://YOUR_UUID@YOUR_SERVER_IP:443?encryption=none&flow=xtls-rprx-vision&security=reality&sni=www.microsoft.com&fp=chrome&pbk=YOUR_PUBLIC_KEY&sid=YOUR_SHORT_ID&type=tcp#ADHAM_STORE";
    
    // محاولة نسخ الرابط تلقائياً للحافظة
    try {
      await navigator.clipboard.writeText(vlessLink);
    } catch(err) {}

    setTimeout(()=>{
      button.disabled=false;
      button.textContent=copy[lang].activate;
      renderSuccess({
        status: 'success',
        custom_happ: true,
        expires_at: '2076-11-13 23:59:59',
        servers: [
          { 
            id: 'adham_store', 
            name: 'ADHAM_STORE (VLESS Reality)', 
            host: 'YOUR_SERVER_IP:443', 
            happ_url: vlessLink 
          }
        ]
      });
      // النقل الفوري لتطبيق Happ
      window.location.assign(vlessLink);
    }, 500);
    return;
  }

  button.disabled=true;
  button.textContent=copy[lang].checking;
  status.className='status';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
    const r=await fetch('api/activate.php',{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify({license_key:key,device_id:deviceId,device_name:navigator.userAgent.slice(0,120)})});
    let d={};
    try{d=await r.json()}catch(_){}
    if(!r.ok||d.status!=='success')throw new Error(d.message||copy[lang].error);
    renderSuccess(d)
  }catch(err){
    show(esc(err.name==='AbortError'?(lang==='ru'?'Сервер отвечает слишком долго. Попробуйте ещё раз.':'The server is taking too long. Please try again.'):friendlyError(err.message)),'error')
  }finally{
    clearTimeout(timer);
    button.disabled=false;
    button.textContent=copy[lang].activate
  }
});
})();
</script>
</body>
